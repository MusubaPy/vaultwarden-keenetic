[build]
target = "mips-unknown-linux-gnu"

[target.mips-unknown-linux-gnu]
linker = "__TOOLCHAIN_DIR__/bin/mips-openwrt-linux-gnu-gcc"
rustflags = [
    "-C", "target-cpu=mips32r2",
    "-C", "target-feature=+soft-float",
    "-C", "link-arg=-Wl,--dynamic-linker=/opt/lib/ld.so.1",
    "-C", "panic=abort",
]
